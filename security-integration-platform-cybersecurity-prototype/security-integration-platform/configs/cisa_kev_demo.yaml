name: cisa_kev_demo
vendor: CISA
product: Known Exploited Vulnerabilities Catalog
category: vulnerability_intelligence

base_url: https://www.cisa.gov

auth:
  type: none

endpoint:
  path: /sites/default/files/feeds/known_exploited_vulnerabilities.json
  method: GET

pagination:
  type: none
  items_path: vulnerabilities

timeout_seconds: 30

mapping:
  entity: vulnerability
  fields:
    external_id: cveID
    title: vulnerabilityName
    description: shortDescription
    timestamp: dateAdded
    source: vendorProject
  required:
    - external_id
